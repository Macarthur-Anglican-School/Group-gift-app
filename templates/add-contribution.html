{% extends 'base.html' %}
{% block title %}Add a contribution | Oscar's Gift List{% endblock %}
{% block content %}<section class="form-panel"><p class="eyebrow">{{ gift.gift_name }}</p><h1>Add a contribution</h1><p>Add the contributor's name and how much they gave.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label for="contributor_name">Contributor's name</label><input required type="text" id="contributor_name" name="contributor_name" value="{{ request.form.get('contributor_name', '') }}" placeholder="e.g. Mia"><label for="amount">Amount ($)</label><input required type="number" id="amount" name="amount" min="0.01" step="0.01" value="{{ request.form.get('amount', '') }}" placeholder="0.00"><div class="form-actions"><a href="{{ url_for('contributions', gift_id=gift.id) }}" class="btn btn-outline-secondary">Cancel</a><button type="submit" class="btn btn-primary">Add contribution</button></div></form></section>{% endblock %}
