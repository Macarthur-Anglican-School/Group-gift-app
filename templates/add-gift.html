{% extends 'base.html' %}
{% block title %}Add a gift | Oscar's Gift List{% endblock %}
{% block content %}<section class="form-panel"><p class="eyebrow">New gift</p><h1>Add a gift for Oscar</h1><p>Enter the gift name and its total price.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label for="gift_name">Gift name</label><input required type="text" id="gift_name" name="gift_name" value="{{ request.form.get('gift_name', '') }}" placeholder="e.g. Headphones"><label for="price">Price ($)</label><input required type="number" id="price" name="price" min="0" step="0.01" value="{{ request.form.get('price', '') }}" placeholder="0.00"><div class="form-actions"><a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Cancel</a><button type="submit" class="btn btn-primary">Add gift</button></div></form></section>{% endblock %}
