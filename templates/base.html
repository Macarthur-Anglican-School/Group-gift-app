<!-- assisted by AI -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Oscar's Gift List{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header"><div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a class="brand" href="{{ url_for('home') }}">Oscar's Gift List</a>
        <nav aria-label="Main navigation"><a href="{{ url_for('home') }}">Gifts</a><a class="nav-add" href="{{ url_for('add_gift') }}">Add gift</a></nav>
    </div></header>
    <main class="container page-content">{% block content %}{% endblock %}</main>
</body>
</html>
